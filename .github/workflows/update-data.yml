name: Update EMBI Data

on:
  schedule:
    # Horas en UTC, minutos fuera de :00 para evitar la congestión de GitHub.
    # El BCRD publica el dato del día hábil anterior entre las 16:00 y las
    # 20:00 UTC. GitHub descarta muchas corridas programadas, así que en esa
    # ventana (lunes a viernes) se intenta cada media hora.
    - cron: '17,47 15-23 * * 1-5'
    # Respaldo fuera de la ventana (incluye fines de semana) por si el BCRD
    # publica tarde o corrige datos.
    - cron: '17 1,5,9,13 * * *'
  workflow_dispatch: # Permite ejecutar manualmente

permissions:
  contents: write

concurrency:
  group: update-embi-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        ref: main

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        pip install pandas openpyxl

    - name: Download and process data
      run: |
        python convert_data.py

    - name: Commit and push if changed
      run: |
        git config --global user.name 'GitHub Actions Bot'
        git config --global user.email 'actions@github.com'
        git add data.json
        if git diff --staged --quiet; then
          echo "No new data found; later scheduled runs will try again."
          exit 0
        fi
        git commit -m "Auto-update EMBI data"
        for attempt in 1 2 3 4; do
          git pull --rebase origin main && git push origin HEAD:main && exit 0
          echo "Push attempt $attempt failed; retrying..."
          sleep $((attempt * 5))
        done
        exit 1
